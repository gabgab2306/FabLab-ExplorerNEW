name: Unpack FabLab project
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: contains(github.event.head_commit.message, 'Add workflow to unpack project') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project into repository root
        run: |
          set -e
          ZIP="FabLab-Explorer-Profesional.zip"
          if [ ! -f "$ZIP" ]; then
            echo "No project ZIP found; nothing to unpack."
            exit 0
          fi
          unzip -o "$ZIP" -d .
          rm "$ZIP"
          node -e "const fs=require('fs'); const p=require('./package.json'); p.scripts.build='vite build'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install FabLab Explorer project files"
          git push
